<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img">
  <title>CloudPath Kubernetes delivery architecture</title>
  <desc>GitHub Actions tests, builds, and scans a Docker image before deploying Kubernetes resources to a kind cluster, with health, metrics, and logs.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#00d084"/></marker><style>text{font-family:'JetBrains Mono',monospace;font-size:16px;fill:#e6e8eb}.muted{fill:#8b929b;font-size:14px}.box{fill:#111318;stroke:#1f252d}.group{fill:none;stroke:#00d084;stroke-dasharray:8 7}.line{stroke:#00d084;stroke-width:2;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect width="1200" height="750" fill="#0a0c0f"/><text x="45" y="50" fill="#00d084">cloudpath / Kubernetes release flow</text>
  <rect class="box" x="40" y="105" width="130" height="64" rx="12"/><text x="65" y="143">Developer</text><rect class="box" x="205" y="105" width="130" height="64" rx="12"/><text x="226" y="143">git push</text><path class="line" d="M170 137h35"/>
  <rect class="group" x="370" y="80" width="340" height="115" rx="12"/><text x="395" y="110" fill="#00d084">GitHub Actions</text><text class="muted" x="395" y="143">test → build → Docker image</text><text class="muted" x="395" y="170">→ Trivy scan</text><path class="line" d="M335 137h35"/>
  <rect class="group" x="40" y="250" width="650" height="280" rx="12"/><text x="65" y="282" fill="#00d084">kind cluster / Namespace</text><rect class="box" x="80" y="330" width="130" height="65" rx="12"/><text x="105" y="368">ConfigMap</text><rect class="box" x="250" y="330" width="130" height="65" rx="12"/><text x="290" y="368">Secret</text><rect class="box" x="420" y="330" width="130" height="65" rx="12"/><text x="455" y="368">Deployment</text><rect class="box" x="250" y="430" width="130" height="65" rx="12"/><text x="290" y="468">Service</text><path class="line" d="M540 195v90H485v45"/><rect class="box" x="760" y="250" width="175" height="65" rx="12"/><text x="792" y="288">Actuator health</text><rect class="box" x="970" y="250" width="175" height="65" rx="12"/><text x="995" y="288">metrics-server</text><rect class="box" x="760" y="350" width="175" height="65" rx="12"/><text x="800" y="388">kubectl logs</text>
  <rect class="box" x="760" y="455" width="385" height="75" rx="12"/><text class="muted" x="780" y="485">rollout undo does not revert</text><text class="muted" x="780" y="510">ConfigMap: restore from Git</text>
  <rect class="box" x="40" y="615" width="1110" height="70" rx="12"/><text x="70" y="645" fill="#00d084">Terraform</text><text class="muted" x="200" y="645">init · fmt · validate · plan</text>
</svg>
