<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img">
  <title>Serene Stay AWS Well-Architected architecture</title>
  <desc>GitHub Actions checks flow into AWS Amplify and a Next.js SSR app connected to encrypted RDS, validated S3 uploads, SSM secrets, and CloudWatch.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#00d084"/></marker><style>text{font-family:'JetBrains Mono',monospace;font-size:16px;fill:#e6e8eb}.muted{fill:#8b929b;font-size:14px}.box{fill:#111318;stroke:#1f252d}.group{fill:none;stroke:#00d084;stroke-dasharray:8 7}.line{stroke:#00d084;stroke-width:2;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect width="1200" height="750" fill="#0a0c0f"/><text x="45" y="50" fill="#00d084">serene stay / secure AWS delivery</text>
  <rect class="box" x="40" y="105" width="130" height="64" rx="12"/><text x="65" y="143">Developer</text><rect class="box" x="205" y="105" width="130" height="64" rx="12"/><text x="226" y="143">git push</text><path class="line" d="M170 137h35"/>
  <rect class="box" x="390" y="105" width="230" height="64" rx="12"/><text x="420" y="135">GitHub Actions</text><text class="muted" x="415" y="157">ESLint + TypeScript</text><path class="line" d="M335 137h55"/>
  <rect class="box" x="680" y="105" width="190" height="64" rx="12"/><text x="720" y="135">AWS Amplify</text><text class="muted" x="700" y="157">build · deploy · rollback</text><path class="line" d="M620 137h60"/>
  <rect class="group" x="40" y="250" width="1110" height="300" rx="12"/><text x="65" y="282" fill="#00d084">AWS application services</text><rect class="box" x="90" y="350" width="220" height="75" rx="12"/><text x="135" y="382">Next.js SSR</text><text class="muted" x="145" y="407">application</text><path class="line" d="M775 169v120H200v61"/>
  <rect class="box" x="390" y="330" width="190" height="65" rx="12"/><text x="425" y="368">RDS PostgreSQL</text><text class="muted" x="455" y="388">SSL</text><rect class="box" x="650" y="330" width="190" height="65" rx="12"/><text x="710" y="368">S3</text><text class="muted" x="675" y="388">validated uploads</text><rect class="box" x="910" y="330" width="190" height="65" rx="12"/><text x="938" y="368">SSM Parameter</text><text class="muted" x="980" y="388">secrets</text><path class="line" d="M310 367h80M310 380h340M310 393h600"/>
  <rect class="box" x="390" y="450" width="190" height="65" rx="12"/><text x="445" y="488">CloudWatch</text><path class="line" d="M310 410h80v72"/>
  <rect class="box" x="650" y="450" width="450" height="65" rx="12"/><text x="685" y="488" fill="#00d084">IAM least privilege</text><text class="muted" x="900" y="488">S3 + CloudWatch only</text>
  <rect class="box" x="40" y="615" width="1110" height="70" rx="12"/><text x="70" y="645" fill="#00d084">Terraform (modular)</text><text class="muted" x="300" y="645">RDS · S3 · IAM · security groups</text>
</svg>
