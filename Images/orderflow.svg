<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img">
  <title>OrderFlow AWS DevOps architecture</title>
  <desc>GitHub Actions authenticates with AWS through OIDC, pushes a scanned image to ECR, and deploys a Spring Boot API and PostgreSQL to k3s. The API sends orders to SQS for a background worker.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#00d084"/></marker>
    <style>text{font-family:'JetBrains Mono',monospace;font-size:16px;fill:#e6e8eb} .muted{fill:#8b929b;font-size:14px} .box{fill:#111318;stroke:#1f252d} .group{fill:none;stroke:#00d084;stroke-dasharray:8 7} .line{stroke:#00d084;stroke-width:2;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="750" fill="#0a0c0f"/>
  <text x="45" y="50" fill="#00d084">orderflow / deployment architecture</text>
  <rect class="box" x="40" y="105" width="130" height="64" rx="12"/><text x="65" y="143">Developer</text>
  <rect class="box" x="205" y="105" width="130" height="64" rx="12"/><text x="226" y="143">git push</text>
  <rect class="box" x="370" y="88" width="190" height="98" rx="12"/><text x="398" y="120">GitHub Actions</text><text class="muted" x="395" y="148">build image</text><text class="muted" x="395" y="169">tag = SHA</text>
  <rect class="box" x="595" y="105" width="105" height="64" rx="12"/><text x="620" y="143">OIDC</text>
  <rect class="box" x="735" y="88" width="175" height="98" rx="12"/><text x="754" y="120">IAM role</text><text class="muted" x="754" y="150">no access keys</text>
  <rect class="box" x="945" y="88" width="150" height="98" rx="12"/><text x="975" y="120">ECR</text><text class="muted" x="962" y="150">scan on push</text>
  <path class="line" d="M170 137h35M335 137h35M560 137h35M700 137h35M910 137h35"/>
  <rect class="group" x="40" y="235" width="1055" height="310" rx="12"/><text x="65" y="267" fill="#00d084">AWS VPC / EC2 + k3s</text>
  <rect class="box" x="85" y="315" width="175" height="80" rx="12"/><text x="112" y="350">Spring Boot</text><text class="muted" x="120" y="376">API</text>
  <rect class="box" x="345" y="315" width="175" height="80" rx="12"/><text x="386" y="350">PostgreSQL</text><text class="muted" x="393" y="376">database</text>
  <path class="line" d="M260 355h85"/><path class="line" d="M345 375h-85"/>
  <rect class="box" x="85" y="445" width="175" height="64" rx="12"/><text x="128" y="483">SQS queue</text>
  <rect class="box" x="345" y="445" width="175" height="64" rx="12"/><text x="368" y="483">Background worker</text>
  <path class="line" d="M172 395v50"/><path class="line" d="M260 477h85"/>
  <text class="muted" x="610" y="350">runtime services</text><rect class="box" x="610" y="375" width="180" height="64" rx="12"/><text x="645" y="413">EC2 instance</text><rect class="box" x="835" y="375" width="180" height="64" rx="12"/><text x="875" y="413">k3s cluster</text><path class="line" d="M790 407h45"/>
  <rect class="box" x="40" y="615" width="1055" height="70" rx="12"/><text x="70" y="645" fill="#00d084">Terraform</text><text class="muted" x="200" y="645">provisions VPC · subnet · security groups · EC2 · ECR · IAM</text>
</svg>
