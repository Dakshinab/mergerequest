<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img">
  <title>SmartLink Oracle Cloud architecture</title>
  <desc>Git pushes trigger automatic deployment to Oracle Cloud, where Nginx rate-limits traffic to a Flask app in Docker Compose and monitoring flows through Prometheus to Grafana.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#00d084"/></marker><style>text{font-family:'JetBrains Mono',monospace;font-size:16px;fill:#e6e8eb}.muted{fill:#8b929b;font-size:14px}.box{fill:#111318;stroke:#1f252d}.group{fill:none;stroke:#00d084;stroke-dasharray:8 7}.line{stroke:#00d084;stroke-width:2;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect width="1200" height="750" fill="#0a0c0f"/><text x="45" y="50" fill="#00d084">smartlink / production deployment</text>
  <rect class="box" x="40" y="105" width="130" height="64" rx="12"/><text x="65" y="143">Developer</text><rect class="box" x="205" y="105" width="130" height="64" rx="12"/><text x="226" y="143">git push</text><rect class="box" x="370" y="105" width="160" height="64" rx="12"/><text x="397" y="143">auto deploy</text><path class="line" d="M170 137h35M335 137h35"/>
  <rect class="group" x="40" y="250" width="720" height="280" rx="12"/><text x="65" y="282" fill="#00d084">Oracle Cloud (Singapore)</text><rect class="box" x="85" y="350" width="180" height="70" rx="12"/><text x="132" y="382">Nginx</text><text class="muted" x="108" y="405">rate limit</text><rect class="box" x="320" y="350" width="210" height="70" rx="12"/><text x="350" y="382">Flask app</text><text class="muted" x="345" y="405">Docker Compose</text><rect class="box" x="585" y="350" width="130" height="70" rx="12"/><text x="615" y="392">Database</text><path class="line" d="M530 137v120H175v73M265 385h55M530 385h55"/>
  <rect class="box" x="825" y="300" width="160" height="65" rx="12"/><text x="860" y="338">Prometheus</text><rect class="box" x="1015" y="300" width="160" height="65" rx="12"/><text x="1050" y="338">Grafana</text><path class="line" d="M985 332h30"/><rect class="box" x="40" y="615" width="1135" height="70" rx="12"/><text x="70" y="645" fill="#00d084">Terraform</text><text class="muted" x="200" y="645">Oracle instance · network · firewall · deployment resources</text>
</svg>
